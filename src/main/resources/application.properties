spring.application.name=exam-manager

# H2 Database Configuration — file-based so data persists across restarts
spring.datasource.url=jdbc:h2:file:./data/examdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# מפתח ה-API נקרא ממשתנה סביבה; לפיתוח מקומי ניתן לשים את הערך כאן זמנית
gemini.api.key=${GEMINI_API_KEY:}
